# The source of truth for docs/journey.html and docs/architecture.md.
# Edit here, then run: uv run python docs/build_journey.py
# ${NAME} is replaced with the constant of that name from the code, so numbers can't drift.
# Every commit must exist in git, every id used below must resolve, and every requirement
# must be met by a node. The build and the tests fail otherwise.
title: Care data agent
subtitle: A care manager asks a question in plain language. An agent answers it by querying a read-only database and cites every record it used.

requirements:
  - id: fr-ask
    kind: functional
    label: Ask in plain language
    text: Ask any question about visits and forms in plain language.
  - id: fr-cite
    kind: functional
    label: Cited claims
    text: Every claim cites the visit or form it came from. Tapping the citation opens that record.
  - id: fr-unknowns
    kind: functional
    label: States the gaps
    text: Each answer says what the records cannot show.
  - id: fr-queries
    kind: functional
    label: Shows its queries
    text: The page shows the queries the agent ran.
  - id: fr-followups
    kind: functional
    label: Suggests follow-ups
    text: After an answer, the page suggests up to 3 follow-up questions.
  - id: fr-refuse
    kind: functional
    label: Refuses writes
    text: A request to change data is refused.
  - id: nfr-safety
    kind: nonfunctional
    label: Read-only
    text: The data cannot be changed. SQLite enforces this, so no prompt wording can undo it.
  - id: nfr-cost
    kind: nonfunctional
    label: Bounded cost
    text: Tool turns, prompt tokens, wall-clock time and concurrent questions are all capped.
  - id: nfr-observe
    kind: nonfunctional
    label: Traceable
    text: Request ids, JSON logs, a prompt version and peak context size make a reported problem findable.
  - id: nfr-privacy
    kind: nonfunctional
    label: Private logs
    text: Logs leave out questions, SQL and parameters unless CARE_LOG_CONTENT=1, because they can name people.
  - id: nfr-offline
    kind: nonfunctional
    label: Runs offline
    text: With no API key, the app answers the five example questions from recordings.
  - id: nfr-scale
    kind: nonfunctional
    label: Scales by narrowing
    text: More data is handled by narrowing with SQL, not by making the prompt longer.
  - id: nfr-drift
    kind: nonfunctional
    label: Cannot drift
    text: Typed events, derived numbers and tests keep the code, the prompt and these docs agreeing.

decisions:
  - id: shape
    q: "What is the agent, and why not a library of ready-made queries?"
    a: "A model, one read-only tool (run_sql) and a loop. The schema, roster and glossary are derived from the data and put in the prompt."
    evidence: "Every golden question and rephrasing passes (42 of 42 on gpt-5.5). A ready-made query per question would hide the schema and need a new function for each new question."
    tradeoff: "The model can write a wasteful query. Caps and the prompt keep that cheap instead of a fixed set of queries preventing it."
    step: 4
  - id: sql_skill
    q: "Is the model good enough at SQL?"
    a: "Yes. Its queries were sound. The weakness was reading too wide, and the 30k result cap fixed that."
    evidence: "The medication question read 145k characters and 114k prompt tokens; at 30k it read about 80k and 75k, ran in 11s instead of 15s, and still found visit 293 and form 22. Tokens fell about 45% with no lost facts."
    tradeoff: "A cap can hide a relevant row in a very wide query. The result carries a truncation flag and the prompt says only clear what you read."
    step: 18
  - id: planning
    q: "Does the SQL need a planning step?"
    a: "No. The first query is the plan, and the roster in the prompt removes the usual counting query."
    evidence: "Simple questions take 1 query and about 3 seconds; broad ones take 4 to 11 queries and 12 to 15 seconds."
    tradeoff: "A planner would cost another model call (3 to 10 seconds) and share the model's blind spots. Revisit if recall fails on varied real notes."
    step: 14
  - id: reasoning
    q: "Should the model think before answering?"
    a: "No. Reasoning is off."
    evidence: "A broad question took 73 seconds and 292k tokens with it on; off it takes about 15 seconds and 60% fewer tokens, with the same eval results."
    tradeoff: "A harder multi-step question might do better with thinking. The evals would show it, so turn it back on only for a failing case."
    step: 12
  - id: status
    q: "Why read the notes and not the status fields?"
    a: "Every one of the 336 visits has the status Completed, so status says nothing. The truth is in the free text."
    evidence: "Visit 293 is marked Completed while its comment says the family had not given the medication. A report built on status would count it as done."
    tradeoff: "It relies on the model reading text, so recall on messier real notes is the first thing to break. Search and embeddings are the next step."
    step: 0
  - id: cannot_know
    q: "Why does it sometimes say the data cannot tell?"
    a: "Visits have no planned time, so late and missed cannot be measured. Saying so is the right answer."
    evidence: "Checked directly: all 336 visits are Completed, all exactly 45 minutes, none missing an end time, and no note or form mentions a missed or late visit."
    tradeoff: "A manager may find the answer unhelpful. A wrong guess from gaps in the data would be worse."
    step: 2
  - id: truncation
    q: "What happens when a result is cut?"
    a: "The result carries a flag and a loud warning, and the prompt says only clear a person you actually read."
    evidence: "Before this, a truncated result let the model clear a person it had not read."
    tradeoff: "More text in the prompt on every cut, and the model must narrow and re-run."
    step: 3
  - id: repeats
    q: "How do we know an eval pass means anything?"
    a: "Repeat it. One passing run proves little for a model that varies."
    evidence: "Medication passed 8 of 8 once, then 2 of 5 when repeated, and 5 of 5 after a window rule. A rephrased care-plan question failed until a plan-date rule was added."
    tradeoff: "A full run with variants and repeats uses about 1.8M tokens. Run it when a prompt, cap or model changes, not on every commit."
    step: 14
  - id: citations
    q: "How do we make a wrong citation impossible to ship?"
    a: "One grammar, a test and an eval check. A citation the page cannot link fails the build."
    evidence: "Evals caught '(visit 327, form 23)' and then '(visits 192-210)', both of which showed as plain text. Each became a prompt rule and a permanent check."
    tradeoff: "The model is held to a strict form, so the prompt carries a few rules about it."
    step: 8
  - id: names
    q: "How does the page know which words are people?"
    a: "The server sends the roster of active people, and the page links any match, however the model formatted it."
    evidence: "Bold, plain and possessive uses all link. A new person needs no page change."
    tradeoff: "A misspelled name stays plain text and nobody is told. Above 30 people the roster switches off in the prompt and the model queries instead."
    step: 16
  - id: today
    q: "What does the app treat as today?"
    a: "The latest visit in the data. The header says so: 'Today is 16 Nov 2025'."
    evidence: "'This week' and 'recent' are resolved against it. Reading the wall clock would give an empty week."
    tradeoff: "With live data this becomes the real date; for this fixed data it is a convention the page has to state."
    step: 2
  - id: dedupe
    q: "Why not de-duplicate repeated comments in a view?"
    a: "Tried and dropped. It removed almost nothing."
    evidence: "After normalising, 572 of 1,135 comments were distinct, but the model's reads did not shrink. The cap did."
    tradeoff: "Repeated carer comments still cost tokens inside the cap."
    step: 18
  - id: not_built
    q: "What did we leave out on purpose?"
    a: "Sign-in, saved history, embeddings, a planner, per-person pages and hover previews on names."
    evidence: "Each has a trigger in 'What breaks next'. Names open a short menu on click, because a name appears many times in one answer and a hover on each would be noise."
    tradeoff: "A manager cannot share a link to an answer, and recall is untested on real, varied notes."
    step: 17

thinking:
  - id: problem
    name: The problem
    question: What counts as a right answer?
    plain: Before any model work, decide what a good answer is. For a care manager it means finding the people who need attention, saying what the records show, and saying what they cannot show. The data sets traps. A status can say Completed while the comment says the medication was not given, and there are no planned times, so lateness cannot be measured.
    here:
      - The requirements at the top of this page
      - Eight golden questions in evals/questions.yaml, one of which must be refused
      - A glossary in the schema that states what the data cannot show
    fails: A fluent answer to the wrong question, such as a number of missed visits when the data cannot measure them.
    check: Golden questions with required facts, one that must refuse a write, and one that must say something cannot be measured.
    gap: The questions come from one person's reading of the data. No real manager has shaped them yet.
  - id: judgement
    name: Judgement
    question: Does it reason well from what it reads?
    plain: This is the model and the instructions it follows. It covers which model answers, how much it thinks first, and how the prompt tells it to choose a time window, compare sources and write the answer.
    here:
      - gpt-5.5 with reasoning off, about 15 seconds for a broad question
      - The system prompt in app/agent.py, versioned by a hash sent with every answer
      - A cheaper model that only suggests follow-ups, outside the loop
    fails: Wrong scope ("any issues" read as "this week"), clearing a person whose notes it never read, or a long answer that hides the point.
    check: Repeats and rephrased questions, plus reading the answers.
    gap: We have no evidence yet that thinking longer helps. A drop in recall on varied notes is the signal to try it.
    numbers:
      - what: "Model ${MODEL}, reasoning ${REASONING_EFFORT}"
        why: "Reasoning off made a broad question about three times faster with about 60% fewer tokens, and the evals still passed. It is also the only reasoning setting this model accepts with tools on this endpoint."
  - id: capability
    name: Capability
    question: What can it see and do?
    plain: The tool and the data it can reach. There is one read-only SQL tool, and we tell it about the database up front so it does not have to explore.
    here:
      - run_sql, one read-only SELECT per call
      - A schema, a roster of people and a glossary, all derived from the data
      - Views that join names to notes, and a full-text search index
      - Caps on rows, cell length and result size
    fails: It cannot find what it needs, a result is so large it floods the prompt, or a cut-off result looks complete.
    check: Guardrail tests, a loud truncation warning in the result, and the scale check.
    gap: A second tool is worth adding only if recall fails.
    numbers:
      - what: "${MAX_ROWS} rows per query"
        why: "Enough to read one person's notes for a fortnight. A bigger result is flagged as cut off, so the model narrows the query instead of guessing about the rest."
      - what: "${MAX_CELL_CHARS} characters per cell"
        why: "A typical note is far shorter. Longer text is cut and marked, so one long field cannot fill the prompt."
      - what: "${MAX_RESULT_CHARS} characters per result"
        why: "About 8k tokens. This caps the whole result, so a wide query cannot flood the prompt. Halved from 60k after an audit: the medication question read 75-83k characters instead of 145k, used 72-78k prompt tokens instead of 114k and ran in 11s instead of 15s, and still found visit 293 and form 22. The 42 required facts in the evals still passed."
      - what: "${TIMEOUT_S} second query limit"
        why: "SQL on this data takes milliseconds, so 2 seconds only stops a runaway statement."
      - what: "${MAX_ROSTER} people in the roster"
        why: "The roster in the prompt costs about 30 tokens a person. Above this it switches off and the model queries instead."
  - id: control
    name: Control
    question: What stops it going wrong or costing too much?
    plain: Limits around the loop. The model chooses its own steps, and the code decides how far it may go. The three limits on one question are independent, and the first to trip wins. The cap on live questions protects the server as a whole. None of the numbers has been tuned against real traffic; they are about double what we have seen.
    here:
      - A read-only connection with an authorizer that allows only reads
      - Three independent limits on one question (steps, prompt tokens, time). The first to trip makes the next turn the answer
      - A cap on live questions at once, then a busy message
      - Text in the database is treated as data, never as instructions
    fails: A runaway loop, an instruction hidden in a note, a cost spike, or one slow question starving the others.
    check: A test for each limit, and per-step timings in the logs.
    gap: There is no sign-in or per-team scoping. Production would scope every query to the caller's team in code.
    numbers:
      - what: "${MAX_STEPS} steps"
        why: "A step is one model turn that may ask for queries. Broad questions use 3 to 5 and simple ones 1 to 2, so this is about double the worst seen. It catches a model that keeps querying without converging. At the limit the next turn must answer with no tools."
      - what: "${TOKEN_BUDGET} prompt tokens"
        why: "Every step resends the whole conversation, so tokens grow faster than steps. A broad question uses 35k to 75k in total, so this is about double. It is the cost guard, and it keeps runs short of the long-context quality drop, which we have not measured. At the limit the next turn must answer."
      - what: "${DEADLINE_S} seconds"
        why: "The normal wait is about 15 seconds and the slowest seen about 20. This is a safety net for a stalled API, not a target. It stops new steps from starting and does not cancel one already running. The API client has its own 90 second timeout."
      - what: "${MAX_CONCURRENT} live questions at once"
        why: "Each holds a server thread and an open model stream for about 15 seconds. 8 is a guess for one care team. It protects the API rate limit and the bill. The ninth gets a busy message and is not queued, because a queue hides overload."
  - id: trust
    name: Trust
    question: Can a person rely on it, and can we tell when it is wrong?
    plain: Everything that lets a person check an answer and lets us notice mistakes. Citations open the record behind a claim. A box lists what the records cannot show. The page says which model wrote the answer. The agent and the page share typed events. Evals run before changes ship.
    here:
      - Tappable citations and names
      - The "what I couldn't determine" box and "Written by gpt-5.5"
      - app/events.py, the typed contract between agent and page
      - Evals with repeats and rephrasings, and logs with a request id
    fails: An answer that is right but cannot be checked, or wrong with nobody noticing.
    check: Contract tests between prompt and page, the evals, and a live walk through real questions.
    gap: Real questions from managers, and notes written by someone other than the builder.
    numbers:
      - what: "${HISTORY_MESSAGES} messages of history"
        why: "Three question and answer pairs. Enough for a follow-up like \"what about her?\", and older turns are dropped so cost stays flat. The server rejects more than this."
      - what: "${QUESTION_CHARS} characters per question"
        why: "A long paste is not a question. The page and the server read the same number from one config."

threads:
  - Contracts hold the layers together. Typed events, the citation grammar and one config file stop them drifting apart, which is why a test checks the prompt and the page agree.
  - A feedback loop improves the first two layers without fine-tuning. A failure becomes a rule and a permanent test case.

nodes:
  - id: page
    layer: Browser
    label: Page
    what: One column of turns. Each turn has a state (starting, querying, writing, done, failed or stopped) and the page is drawn from that state.
    invariant: The DOM is derived from the turn state. Nothing reads state back from the DOM.
    limits: ["Questions up to ${QUESTION_CHARS} characters", "Sends the last ${HISTORY_MESSAGES} messages with each question"]
    meets: [fr-ask, fr-cite, fr-unknowns, fr-queries, fr-followups]
    primary: fr
    tradeoffs:
      - Plain JavaScript with no framework or build step. It costs hand-written rendering code.
      - Citations are record ids that the page fetches on tap. An id that does not exist shows an error in the record dialog.
    breaks: Nothing yet. Text is revealed a few characters per frame and only the changing line is touched, which is fine at answer sizes.
    scale: No change. It is static files.
  - id: server
    layer: Server
    label: FastAPI server
    what: One streaming endpoint, POST /api/ask/stream, plus record lookups and the page. Every request gets an id that appears on every event and log line.
    invariant: At most ${MAX_CONCURRENT} live questions run at once. The next one is told to retry, not queued.
    limits: ["${MAX_CONCURRENT} live questions at once", "Logs omit questions, SQL and parameters unless CARE_LOG_CONTENT=1"]
    meets: [fr-ask, nfr-cost, nfr-observe, nfr-privacy]
    primary: nfr
    tradeoffs:
      - A hard cap with a "busy" reply. It costs some refused questions at peak, and it needs no queue.
      - Each stream runs in a worker thread. This is simple to write and holds one thread per live question.
      - No per-user quotas, because the app has no user identity.
    breaks: Each live question holds a worker thread for up to ${DEADLINE_S} seconds before the final answer turn starts.
    scale: An async client or a queue, and per-user quotas, which need identity first.
  - id: events
    layer: Server
    label: Event protocol
    what: One definition of every event the agent, a replay or the server can emit. Tests validate real streams against it.
    invariant: Each stream runs query, result, delta, done, suggestions. Discard and error are the only exceptions.
    meets: [nfr-drift, fr-queries]
    primary: nfr
    tradeoffs:
      - Typed dicts checked in tests, not a schema service. A new event type needs one edit and one test.
    breaks: Nothing. The protocol lived in a docstring until the step 9 audit.
    scale: Version the events once a second client exists.
  - id: records
    layer: Server
    label: Record lookup
    what: Turns a citation such as (visit 293) into the full record behind it, by primary key.
    invariant: A citation holds ids only, in the exact form (visit 12) or (form 4). Dates stay in the sentence.
    meets: [fr-cite]
    primary: fr
    tradeoffs:
      - Lookup by id. It costs a second request when a citation is tapped, and the answer stays small.
    breaks: Any id can be fetched. There is no auth and no organisation scoping.
    scale: Scope every lookup to the caller's organisation.
  - id: replay
    layer: Server
    label: Replay mode
    what: Recorded real answers for the five example questions, so the app runs with no API key and no network.
    invariant: Replay and live emit the same events, so the page cannot tell them apart.
    meets: [nfr-offline]
    primary: nfr
    tradeoffs:
      - Recordings go stale when the prompt changes. They store the model and date, and they are re-recorded by one command.
    breaks: Only the five example questions have recordings. Any other question gets a message to set OPENAI_API_KEY.
    scale: Not used in production.
  - id: schema
    layer: Agent
    label: Schema and glossary
    what: The model's picture of the database. It is derived from the live file and cached per file version. The glossary holds only meaning the data cannot show.
    invariant: Facts the data can show are computed. Hand-written text covers only what the data cannot say.
    limits: ["Samples ${SAMPLE_ROWS} rows per table"]
    meets: [fr-ask, nfr-drift, nfr-scale]
    primary: nfr
    tradeoffs:
      - Derived on load, not written by hand. It cannot go stale, and sampling can miss rare values.
      - We turned down a describe_schema tool, which would add a round trip to every question.
    breaks: Sampling misses rare values and rare JSON paths in a big table.
    scale: Stratified sampling, or a stored profile refreshed offline.
  - id: agent
    layer: Agent
    label: Agent loop
    what: The model plans a query, the code runs it, the result goes back to the model, and this repeats. ask_stream is the only implementation of the loop.
    invariant: Three bounds apply to every question. When the first trips, the next model turn has tools switched off and must answer.
    limits: ["${MAX_STEPS} tool turns", "${TOKEN_BUDGET} prompt tokens", "${DEADLINE_S} seconds"]
    meets: [fr-ask, fr-unknowns, nfr-cost, nfr-observe]
    primary: fr
    tradeoffs:
      - A cut-off still produces an answer from what was read. It costs completeness on broad questions, and the answer has to say so.
      - Prompt tokens are counted per call and summed, so the budget tracks cost. The peak call is logged separately to show real context size.
      - We turned down letting the model run until it stops by itself, because one confused question could spend without limit.
    breaks: Recall on broad questions. The model reads a slice of the notes and can answer confidently, and a missed person raises no error.
    scale: Shortlist people with SQL, give each one a small context in parallel, then rank.
  - id: model
    layer: Agent
    label: Model
    what: gpt-5.5 writes the queries and the answer. A cheaper model, gpt-5.4-mini, only suggests follow-ups, outside the loop. One question makes 3 to 5 calls to gpt-5.5, each carrying the same system prompt, the last 6 messages, the question and everything read so far, plus one short call to gpt-5.4-mini after the answer.
    invariant: The prompt carries a version hash. It is logged and returned with every answer.
    meets: [fr-ask, fr-unknowns, fr-followups, fr-refuse, nfr-observe]
    primary: fr
    tradeoffs:
      - Follow-ups fail soft: an error gives an empty list and a log line, never a failed answer.
      - The prompt tells the model to refuse writes. This is a courtesy, and the database refusal is what enforces it.
    breaks: Answer quality drops as context grows. Each step re-sends the whole conversation, so prompt tokens grow with every step.
    scale: Smaller contexts per person, and prompt caching, whose hit rate is already measured.
  - id: tool
    layer: Data
    label: run_sql tool
    what: The agent's only tool. It takes one SELECT with parameters. Errors go back to the model as text so it can fix its own SQL.
    invariant: There is one tool, so there is one place where queries are checked.
    meets: [fr-queries, nfr-safety]
    primary: nfr
    tradeoffs:
      - Free-form SQL instead of a tool per report. It allows any question, and the model can write valid SQL that is wrong.
      - Every query is recorded in the trace, so a wrong one can be seen.
    breaks: Model-written SQL can be valid and wrong, such as a join that drops people.
    scale: A flatter read model gives fewer wrong queries.
  - id: db
    layer: Data
    label: Read-only guard
    what: SQLite itself refuses anything except bounded reads. The prompt is never the safety.
    invariant: The file is opened mode=ro with query_only on, an authorizer allows only reads, and each call runs one statement.
    limits: ["${MAX_ROWS} rows, ${MAX_CELL_CHARS} characters per cell, ${MAX_RESULT_CHARS} characters per result", "${TIMEOUT_S} second query deadline", "Strings or blobs over ${MAX_VALUE_BYTES} bytes cannot be built"]
    meets: [nfr-safety, nfr-cost, fr-refuse]
    primary: nfr
    tradeoffs:
      - Authorizer rules instead of a regex on SQL. It costs a short allow-list to maintain, and it cannot be bypassed by odd syntax.
      - Caps cut results, and a cut sets a flag and a warning the model sees. We turned down a subprocess for hard timeouts, since the length limit covers the real risk.
    breaks: LIKE and json_each scan whole tables, so a big source hits the ${TIMEOUT_S} second deadline.
    scale: Real indexes. On Postgres, a read-only role and statement_timeout.
  - id: readmodel
    layer: Data
    label: Views and full-text index
    what: Three flat views (one row per note, comment or form answer, with the person joined) and an FTS5 index over all free text. They are built in each connection's temp database.
    invariant: The source file is never written, and the agent cannot write to the index.
    meets: [nfr-scale, fr-ask]
    primary: nfr
    tradeoffs:
      - Rebuilt for every connection. That takes about 6 ms at this size and needs no sync logic.
      - Search finds candidates fast, but the prompt still tells the model to read the text, because carers phrase things in many ways.
    breaks: The rebuild on every connection grows with the data.
    scale: Real views and a persistent index kept in sync by triggers.
  - id: evals
    layer: Checks
    label: Evals
    what: Eight golden questions with required facts, each also asked two or three other ways and repeated. One is a write request that must be refused. A scale check adds many quiet people and confirms the real concerns still surface.
    invariant: A prompt change is measured against the same questions, asked several ways, more than once.
    limits:
      - "A full run on gpt-5.5 is about 300k tokens; with phrasing variants about 950k"
    meets: [nfr-drift, nfr-scale]
    primary: nfr
    tradeoffs:
      - Checks look for facts in the answer. They are cheap and repeatable, and they do not judge reasoning or ranking.
      - A single run hid a question that passed 2 times in 5, so any prompt change is repeated before it is trusted.
      - We turned down scoring with another model, which adds seconds and shares the same blind spots.
    breaks: One person wrote the answers, the checks and the rephrasings, so blind spots are in all three.
    scale: Labelled data and phrasings from someone who did not write the agent, and a sample of real questions.


edges:
  - {from: page, to: server, label: question (NDJSON stream)}
  - {from: page, to: records, label: tap a citation}
  - {from: server, to: events, label: typed events}
  - {from: server, to: replay, label: no API key}
  - {from: server, to: agent, label: live question}
  - {from: agent, to: model, label: prompt, tool}
  - {from: schema, to: agent, label: schema}
  - {from: agent, to: tool, label: SQL and params}
  - {from: tool, to: agent, label: result as text}
  - {from: tool, to: db, label: SELECT}
  - {from: db, to: tool, label: rows, capped}
  - {from: db, to: readmodel, label: views and FTS}
  - {from: records, to: db, label: SELECT by id}
  - {from: evals, to: agent, label: golden questions}

story:
  title: "Priya, a care manager, opens the page at 8am and asks: Who needs my attention this week?"
  steps:
    - node: page
      text: Priya taps the first example question. The page sends it with the last ${HISTORY_MESSAGES} messages to POST /api/ask/stream.
    - node: server
      text: The server gives the request an id, checks the question is at most ${QUESTION_CHARS} characters, and takes one of ${MAX_CONCURRENT} live slots.
    - node: schema
      text: The agent builds the prompt. It includes the schema, derived from the live database, and the reference date, so "this week" means the 7 days up to that date.
    - node: model
      text: The model plans a query. It filters by date window and form type before it reads any notes.
    - node: tool
      text: The model calls run_sql with a SELECT. The page shows the SQL as it runs.
    - node: db
      text: SQLite runs the query read-only against the views and the full-text index. The result stops at ${MAX_ROWS} rows and ${MAX_RESULT_CHARS} characters.
    - node: model
      text: The rows go back as text. The model reads them, runs more queries if it needs to, and writes the answer with citations such as (visit 293).
    - node: page
      text: The answer streams in. Below it the page shows a box of what the records cannot show, and up to 3 follow-up chips.
    - node: records
      text: Priya taps (visit 293). The page fetches that visit by id and shows the carer, the time, the status and the note.

steps:
  - id: 0
    when: "16:05"
    title: Look at the data first
    commits: [fa4cba9]
    nodes: []
    A: answer from structured fields
    B: answer from free text, and say what is absent
    why: Every visit is Completed, lasts 45 minutes, and has no planned time. All the risk is in free text, and sometimes the text contradicts the status.
    found: Iris's medication is marked Completed, but the comment says it wasn't given.
    rejected: ["Counting statuses, which carry no signal."]
    breaks: Nothing yet. This step is only reading.
  - id: 1
    when: "17:01"
    title: Safety in the database
    commits: [992490c]
    nodes: [tool, db]
    A: a prompt that asks for read-only
    B: SQLite refuses everything except bounded reads
    why: A model can be talked out of a prompt. It cannot talk SQLite out of an authorizer.
    rejected: ["A tool per report, which is the fixed-reports design the brief avoids.", "A regex filter on SQL."]
    breaks: LIKE and json_each scan the whole table.
  - id: 2
    when: "17:02"
    title: The schema is derived
    commits: [d0e4922]
    nodes: [schema]
    A: a hand-written schema in the prompt
    B: built per call from the live file
    why: It cannot go stale. It also showed the model that every status is Completed.
    rejected: ["A describe_schema tool, which adds a round trip to every question."]
    breaks: Sampling misses rare values in a big table.
  - id: 3
    when: "17:02"
    title: Results are bounded, and cuts are flagged
    commits: [b54eb8d, 69cf10c]
    nodes: [db]
    A: unbounded rows
    B: caps on rows, cell length and total size, with a truncation flag and a warning
    why: 200 rows of long notes is about 25k tokens in one call.
    found: "A review found three gaps: a 400 MB zeroblob, cut cells with no flag, and a blob that crashed the tool."
    rejected: ["A subprocess for hard native timeouts. A length limit covers the real risk."]
    breaks: A cap gives the model a slice. It can read a slice and answer confidently.
  - id: 4
    when: "17:04"
    title: The loop and its trace
    commits: [03e9094]
    nodes: [agent, model]
    A: an answer with no visible reasoning
    B: every query recorded, and a step limit
    why: A reviewer can see why it answered as it did.
    found: The first live run caught 3 of 5 people. It read a few people's notes and claimed it had checked everyone.
    rejected: ["Letting the model run until it stops by itself."]
    breaks: Recall on broad questions, and tokens that grow with every step.
  - id: 5
    when: "17:07"
    title: Evals decide
    commits: [fe594dd]
    nodes: [evals]
    A: judging by reading
    B: golden questions with required facts
    why: A prompt change has to be measured.
    found: The first run failed 3 of 8 questions and led to four general fixes. Later, the mini model scoped medication to 7 days and cleared Iris, so answers now state their date range.
    rejected: ["Scoring with another model, which would share the same blind spots."]
    breaks: One person wrote the answers and the checks. They confirm facts appear, not that the reasoning is right.
  - id: 6
    when: "17:08"
    title: A page, then streaming
    commits: [b62d2d5, ebaf43f, 0523fbc]
    nodes: [page, server]
    A: a 20 to 60 second blank wait
    B: queries and text appear as they happen
    why: ask_stream is the one implementation of the loop, so every caller runs the same code.
    rejected: ["A front-end framework.", "A markdown library. The renderer escapes text first instead."]
    breaks: Each live question holds a thread until it finishes.
  - id: 7
    when: "17:26"
    title: Request ids and a token budget
    commits: [9121603, d042f0d, 34787dc]
    nodes: [replay, server, agent]
    A: no ids and no cost view
    B: request ids, JSON logs, token counts, a prompt-token budget, and replay mode
    why: A reported problem has to be findable, and cost has to be capped whatever the model wants.
    found: The broadest question used 122k prompt tokens in total, because each step re-sends the conversation.
    rejected: ["Retrying silently. Failures are shown."]
    breaks: Total tokens say little about what the model's context actually held.
  - id: 8
    when: "17:44"
    title: Citations people can open
    commits: [34787dc, c0e1902, 0d705a9, b8d6183]
    nodes: [records, page]
    A: a text answer
    B: tappable citations, a box for what the records cannot show, follow-up chips, Emma's look
    why: A care manager needs to check where a claim came from.
    found: A date inside a citation became buttons, and a long suggestion clipped the input.
    rejected: ["Side chats and pasted objects, which were out of scope.", "Autofilling a suggested question. A phone has no Tab key, so there are chips."]
    breaks: Any record id can be fetched with no auth.
  - id: 9
    when: "18:09"
    title: Untangle audit
    commits: [5344a6b, cdbe9ea]
    nodes: [events, server, page]
    A: hidden links, and a protocol that lived in a docstring
    B: one config module, typed events, record reads out of the server, three run bounds
    why: Code that changes together should sit together, and a convention should be something a test can check.
    found: ".env was only loaded because the agent module happened to import first, and the run mode was read three times per request."
    rejected: ["Keeping /api/ask. It duplicated the stream endpoint, so it was deleted."]
    breaks: Nothing new. It removed ways to break.
  - id: 10
    when: "18:30"
    title: Peak context, quiet logs, a concurrency cap
    commits: [9f2d8b2]
    nodes: [server, agent]
    A: total tokens, names in logs, unlimited questions
    B: peak context logged, content-free logs, at most ${MAX_CONCURRENT} live questions
    why: Totals re-count the conversation at every step. The peak call shows what the model actually held.
    found: On a live run the peak was 2.6k tokens against 7.2k in total.
    rejected: ["A queue and per-user quotas. They need user identity, which this app doesn't have."]
    breaks: The cap protects cost but is not a quota per person.
  - id: 11
    when: "19:00"
    title: A flat read model, search, and a scale check
    commits: [b24568f]
    nodes: [readmodel, tool, evals]
    A: nested json_each queries
    B: three views and an FTS5 index, through the same one tool
    why: Fewer ambiguous-column retries, and a cheap way to find where words occur.
    found: With 40 times as many quiet people (about 205 in all) the broad question still found all five real concerns in 13 s. The clones repeat their text, so this is easier than production.
    rejected: ["A separate search tool, which would change the event protocol for no gain."]
    breaks: The index is rebuilt for each connection. That is fine here and slow at scale.

  - id: 12
    when: "19:20"
    title: Faster answers and a visible working state
    commits: [d9dda8d]
    nodes: [model, page]
    A: 73 seconds and 292k tokens on the broad question, with a static "Running query 9"
    B: reasoning off for the answering model, and a live status line with a timer and the current query
    why: Most of the wait was the model thinking before each query. Turning that off cut time by two thirds and tokens by more than half.
    found: On the broad question gpt-5.5 took 51 to 73 seconds with reasoning on and 19 to 21 seconds with it off. All five people were still found and 8 of 8 evals passed. gpt-5.4-mini missed one person in a single default run.
    rejected: ["The Responses API for finer control of reasoning: a bigger change for the same gain.", "gpt-5.4-mini as the default: one run missed a person."]
    breaks: Less thinking can cost depth on hard questions. The evidence is 8 questions, run once each.

  - id: 13
    when: "22:30"
    title: Shorter answers and calmer streaming
    commits: [e623196]
    nodes: [model, page]
    A: answers of 580 to 1,100 words, text re-rendered on every token, and "N records cited" that did nothing when tapped
    B: a prompt that asks for a ranked list, at most 3 evidence bullets per person and under 250 words, whole-line streaming, and a cited-records list you can open
    why: A manager acts on an answer in seconds. Long answers hid the point, and half-written lines flashed in with half-formed citations.
    found: A live walk through 11 questions found long answers, a ranking that put the two people getting worse with no form raised last, invented names in follow-up chips, and raw dashes in the question list. The first short prompt dropped Alfred's confusion, so the evidence rule now asks for one bullet per concern.
    rejected: ["Streaming every token: it re-renders the whole answer each time and shows broken citations.", "Saving history across reloads: not yet, the page starts empty on purpose."]
    breaks: A short answer can leave out a real concern. The evals check the named facts, not the whole answer.

  - id: 14
    when: "23:10"
    title: A roster in the schema, and a flaky eval caught by repeating it
    commits: [d5d604c]
    nodes: [schema, agent, evals]
    A: step 1 was nearly always a query that counted notes per person, and "any medication issues" passed its eval 2 times in 5
    B: the schema lists everyone with their visit counts, the prompt says only words like "this week" narrow the window, and every step is timed
    why: The count query cost about 2.5 seconds of the 7 before the first word, and the model was reading "any issues" as "this week", which hid a 9 Nov problem.
    found: Run once, the eval looked fine, because 8 of 8 passed on a lucky run. Run five times it passed 2 of 5, and 0 of 5 with the roster before the window rule. After the rule it passed 5 of 5 and the full set passed 8 of 8. First word moved from 7 to 8 seconds to 6 to 7, and steps from 3 to 5 down to 3 or 4. That gain is small and the runs vary.
    rejected: ["A second model that grades whether the answer is complete: it adds 3 to 10 seconds and shares the first model's blind spots.", "Re-sending old query results on follow-ups: tens of thousands of tokens against a query that costs 20 milliseconds."]
    breaks: The roster lists every person, so at about 200 people it becomes 8k tokens. It switches itself off above 30 people and the model queries instead.

  - id: 15
    when: "23:40"
    title: Ask each golden question several ways
    commits: [6e47e5a]
    nodes: [evals, agent]
    A: one phrasing per golden question, run once
    B: two more phrasings per question that a manager might type, run with --variants and repeated
    why: The medication miss came from a phrasing, not a missing fact. The way to find the next one is to change the words and keep the check.
    found: 20 of 21 passed on the first run of the variants. The failure was "Do any care plans need updating?", which named the right people but never said the plans date from 3 Nov or have no review date. A rule to give the plan's date fixed it, and 9 of 9 passed over three repeats.
    rejected: ["A model that writes the paraphrases: it would drift toward how the model already reads questions, which is the blind spot."]
    breaks: Eleven extra phrasings is a small sample. The check is a list of required facts, so it cannot see a wrong ranking or a missing nuance.

  - id: 16
    when: "00:10"
    title: Names in the answer open a follow-up
    commits: [ab7beab]
    nodes: [page, server]
    A: people's names were plain text in the answer
    B: every name from the roster is a button that puts "How has Alfred Nkemelu been this week?" in the composer, without sending it
    why: A manager acts on people, so the next question is usually about one. The tap saves typing and uses wording the evals already check.
    found: The page decides who is a person from the roster the server sends, not from how the model wrote the answer, so bold, plain and possessive uses all behave the same. Only full names match; a bare "Alfred" stays plain because the rule must never guess.
    rejected: ["Matching first names: it breaks the day two people share one.", "Sending the question on tap: the manager should choose what to ask."]
    breaks: A name the model misspells is not linked, and nobody notices. The roster is the one list, so a new person needs no page change.

  - id: 17
    when: "00:40"
    title: A name opens four fixed questions
    commits: [d433777]
    nodes: [page]
    A: tapping a name filled the composer with one question
    B: tapping a name opens a small menu of four questions (this week, what changed against the week before, is the care plan current, is there an open safeguarding case) that fill the composer
    why: Managers act on people. The four questions are the ones a manager keeps asking about a person, so a fixed list saves typing at no cost and needs no extra model call.
    found: Run for one person, all four answered in 6 to 10 seconds in 2 steps. "What changed since last week" described changes inside the week, so the question now says "this week compared with the week before", and the answer then compared both weeks.
    rejected: ["A model that writes drill-downs for each name: another call per tap for questions that barely vary.", "Sending the question on tap: the manager chooses what to ask."]
    breaks: The four are the same for everyone. A person with no safeguarding history still gets that question, and the answer is a short no.
  - id: 18
    when: "01:20"
    title: Read less, cite plainly
    commits: []
    nodes: [model]
    A: the medication question read 145k characters of results and 114k prompt tokens in 11 queries
    B: results cap at 30k characters; the prompt says never to write citation ranges
    why: An audit of the SQL the model chose showed it writes sound queries but reads wide, because a text search over every comment returns far more than it needs. Capping the result makes it narrow the query instead, at no loss of facts.
    found: A view of de-duplicated comments looked promising but removed almost nothing (572 of 1135 were distinct after normalising), so it was dropped. Repeated evals then caught "(visits 192-210)", which the page cannot link, so the prompt now forbids ranges and the eval check fails on them.
    rejected: ["A domain library of ready-made queries: it hides the schema from the model and grows with every new question.", "An explicit planning step: the roster already removes the counting query, and the first query is the plan."]
    breaks: A cap this size can hide a relevant row in a very wide query. The truncation warning tells the model, and it must narrow and re-run before clearing anyone.

next:
  - id: n1
    title: Measure recall with varied text
    problem: Today the agent finds all five real concerns when the quiet people repeat the same text. Real notes vary, so we do not know whether it would still find them. A missed person gives no error.
    why_not_yet: It needs a bigger test set with varied text, ideally written by someone other than me.
    trigger: Now. It is the one thing we cannot see.
    A: five of five on repeated text
    B: the same check with varied text and a source of realistic size
    touches: [evals, agent]
  - id: n2
    title: Store the read model
    problem: The flat views and the search index are rebuilt for every query the agent runs. That takes about 6 ms on this data and would take far longer on a large database.
    why_not_yet: At this size, rebuilding is simpler than keeping a stored index in sync.
    trigger: When the source is big enough that per-connection builds hurt.
    A: temp views and an index built per connection
    B: real views, a persistent FTS index kept in sync by triggers, and real indexes
    touches: [readmodel, db]
  - id: n3
    title: One page per person
    problem: To answer who needs attention, the agent re-reads the raw notes on every question. With thousands of people that is slow and costly.
    why_not_yet: A page that is stale or wrong can mislead. At 10 people, reading the raw records is cheaper and safer.
    trigger: When the scale check stops finding everyone, or broad questions get slow.
    A: the agent re-reads raw notes every time
    B: a dated, cited page per person, rebuilt offline, used as a lead and checked against the records
    touches: [agent, schema]
  - id: n4
    title: Fan out per person
    problem: One agent reads everyone in one long conversation. Past a certain length, models read less carefully, so a person can be missed.
    why_not_yet: The largest single call so far was about 32k tokens, which is fine.
    trigger: When one context is too long to read well.
    A: one long sequential loop
    B: shortlist with SQL, one small context per person in parallel, then rank
    touches: [agent, server]
  - id: n5
    title: Embeddings, if measured
    problem: Keyword search finds near-fall but not unsteady on his feet. If real notes use many phrasings, some concerns would be missed.
    why_not_yet: Nothing measured shows a phrasing miss, and embeddings add an index to keep current.
    trigger: Only when a measured miss comes from phrasing.
    A: keywords
    B: embeddings combined with FTS5 to propose candidates
    touches: [readmodel]
