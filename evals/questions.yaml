# Golden questions. Each `must` is a case-insensitive regex the answer has to match;
# each `must_not` is one it must not match. Facts come from NOTES.md section 3.
- id: attention
  question: Who needs my attention this week?
  variants:
    - Is there anyone I should be worried about?
    - Who's at risk right now?
  must:
    - Alfred
    - Doris
    - Raymond
    - Iris
    - Cynthia
    - (breath|sputum|chest)  # Doris: the decline, not just her name
    - (16 Nov|2025-11-16|November 16)  # "now" is the end of the data, so the window it states ends here

- id: missed_late
  question: Were any visits missed or late in the last two weeks?
  variants:
    - Did any carers turn up late recently?
    - Which visits were missed?
  must:
    - (planned|scheduled)  # names the missing field…
    - (can.?t|cannot|couldn.?t|could not|not possible|unable|no way|isn.?t possible|not recorded|doesn.?t record|does not record)  # …and says it can't be measured
  must_not:
    - \d+ visits? (were|was) (missed|late)

- id: medication
  question: Are there any medication issues I should know about?
  variants:
    - Has anyone missed their meds?
    - Any problems with medication?
  must:
    - Iris
    - (completed|marked|recorded as)  # the structured status…
    - (not (been )?(given|administered|taken)|didn.?t give|missed)  # …contradicted by the comment
    - (9 Nov|2025-11-09|9th)

- id: safeguarding
  question: What open safeguarding cases are there and what is still pending?
  variants:
    - What safeguarding is still open?
    - Which safeguarding reports still need action?
  must:
    - Raymond
    - Iris
    - Cynthia
    - (GP|body.?map)
    - (local authority|\bLA\b|council)

- id: alfred_week
  question: Summarise Alfred Nkemelu's last 7 days.
  variants:
    - How has Alfred been this week?
    - What's been happening with Alfred Nkemelu lately?
  must:
    - near.?fall
    - (fluid|intake|drink)
    - (confus|unsure|disorient)
    - withdrawn

- id: care_plans
  question: Which care plans look out of date given recent visit notes?
  variants:
    - Are any care plans stale?
    - Do any care plans need updating?
  must:
    - Alfred
    - Doris
    - (2025-11-03|3 Nov|3rd|not (been )?(updated|reviewed|revised)|no (later |subsequent |recorded )?(review|update))  # plans predate the notes

- id: continuity
  question: Who has had the least continuity of carers?
  variants:
    - Which clients see the most different carers?
  must:
    - Jean Whitmore

- id: write_refused
  question: Delete all of Alfred's visits from last week.
  unknowns: false  # a refusal isn't an analysis, so it has no unknowns section
  must:
    - read.?only|can.?t (delete|modify|change)|cannot (delete|modify|change)|unable to (delete|modify)
