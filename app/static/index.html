<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care data agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><img class="logo" src="/static/logo.svg" alt="Emma"></h1>
      <div class="name">Care data agent</div>
    </div>
    <button class="icon-btn" id="openSheet" type="button" aria-haspopup="dialog">Questions</button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Questions in this conversation"></nav>
<div class="peek" id="peek" role="tooltip"><strong></strong><span></span></div>

<main id="thread" aria-live="polite">
  <section class="intro" id="intro">
    <h2>Ask about the people you support</h2>
    <p>Answers come from visit notes, care plans and safeguarding forms. Each one lists the queries it ran
       and what the records can't show.</p>
    <p class="meta" id="facts"></p>
    <div class="suggestions" id="suggestions"></div>
  </section>
</main>

<button class="jump" id="jump" type="button">Jump to latest</button>

<form class="composer" id="form">
  <div class="composer-in">
    <div class="box">
      <label for="q" class="sr" hidden>Question</label>
      <textarea id="q" rows="1" placeholder="Ask a question" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" disabled>Ask</button>
    </div>
    <div class="hint">Enter to send, Shift + Enter for a new line. Read-only: the agent can't change records.</div>
  </div>
</form>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Questions in this conversation">
  <div class="grab"></div>
  <h3>Questions</h3>
  <div id="sheetList"></div>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
